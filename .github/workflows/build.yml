name: Build Exe

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install colorama pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --name "Gestionale_DPI" app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: Gestionale_DPI_EXE
          path: dist/Gestionale_DPI.exe
